<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Druk Deals – Sign Up</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: url('/images/punakha.webp') center center / cover no-repeat fixed; color: #1f2937; margin: 0; font-family: Inter, system-ui, sans-serif; }
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: transparent; }
    .auth-form-box { width: 100%; max-width: 360px; border-radius: 28px; background: rgba(255,255,255,0.72); border: 1px solid rgba(255,255,255,0.85); backdrop-filter: blur(22px); box-shadow: 0 24px 50px rgba(15,23,42,0.08); overflow: hidden; transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .auth-form-box:hover { transform: translateY(-3px); box-shadow: 0 28px 60px rgba(15,23,42,0.12); }
    .auth-card-header { padding: 24px 24px 16px; background: transparent; color: #111827; text-align: center; }
    .auth-card-header .brand-badge { display: block; text-transform: uppercase; letter-spacing: 0.18em; color: #333333; font-size: 0.98rem; font-weight: 900; margin: 0 auto 10px; }
    .auth-card-header h1 { margin: 0 0 10px; font-size: 1.75rem; line-height: 1.1; color: #111827; font-weight: 400; }
    .auth-card-header p { margin: 0 auto; color: #475569; line-height: 1.6; max-width: 320px; }
    .form-body { padding: 24px; }
    .auth-form-header h2 { margin: 0 0 4px; font-size: 1.9rem; color: #0f172a; }
    .auth-form-header p { margin: 8px 0 24px; color: #64748b; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.08em; }
    .form-group input { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
    .form-group input:focus { border-color: #f59e0b; box-shadow: 0 0 0 4px rgba(245,158,11,0.15); }
    .btn-primary { width: 100%; border-radius: var(--radius-sm); padding: 13px 28px; background: var(--saffron); color: var(--white); border: none; font-weight: 600; cursor: pointer; transition: var(--transition); }
    .btn-primary:hover { background: var(--saffron-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .auth-switch { margin-top: 22px; text-align: center; font-size: 0.95rem; color: #64748b; }
    .auth-switch a { color: #f59e0b; text-decoration: none; font-weight: 700; }
    @media (max-width: 640px) { .auth-form-box { border-radius: 20px; } .auth-card-header { padding: 28px 24px 18px; } .form-body { padding: 28px 24px; } }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-form-box">
      <div class="auth-card-header">
        <div class="brand-badge">Sign Up</div>
        <h1>Create your account</h1>
        <p>Join Druk Deals and start listing items today.</p>
      </div>
      <div class="form-body">
        <div class="auth-form-header">
        
          <p>Enter your details below.</p>
        </div>

        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="Karma Dorji" autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password">
        </div>

        <button class="btn btn-primary" id="signupBtn" onclick="signup()">Create Account</button>

        <p class="auth-switch">
          Already have an account? <a href="/login">Login here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
