services:
  - type: web
    name: drukdeals
    runtime: go
    rootDir: drukdeals
    buildCommand: go build -o drukdeals_server .
    startCommand: ./drukdeals_server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drukdeals-db
          property: connectionString

databases:
  - name: drukdeals-db
    databaseName: drukdeals_db
    user: drukdeals
